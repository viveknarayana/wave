apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: wave
  labels:
    app: gateway
spec:
  replicas: 3
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: gateway
          image: gateway:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: REDIS_URL
              value: "redis://redis:6379/0"
            # Pin conversation_ids to specific vLLM instances via stable StatefulSet pod DNS.
            # worker_client maps WORKER_1_URL -> worker-1, WORKER_2_URL -> worker-2, etc.
            - name: WORKER_1_URL
              value: "http://worker-0.worker-headless.wave.svc.cluster.local:8000"
            - name: WORKER_2_URL
              value: "http://worker-1.worker-headless.wave.svc.cluster.local:8000"
            - name: WORKER_3_URL
              value: "http://worker-2.worker-headless.wave.svc.cluster.local:8000"
            - name: WORKER_4_URL
              value: "http://worker-3.worker-headless.wave.svc.cluster.local:8000"
            - name: WORKER_5_URL
              value: "http://worker-4.worker-headless.wave.svc.cluster.local:8000"
            - name: WORKER_6_URL
              value: "http://worker-5.worker-headless.wave.svc.cluster.local:8000"
            - name: WORKER_7_URL
              value: "http://worker-6.worker-headless.wave.svc.cluster.local:8000"
            - name: WORKER_8_URL
              value: "http://worker-7.worker-headless.wave.svc.cluster.local:8000"
            # Avoid lazy-loading embeddings on first request (slow + heavy); enable for cache demos.
            - name: ENABLE_PROMPT_CACHE
              value: "0"
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: wave
  labels:
    app: gateway
spec:
  type: NodePort
  selector:
    app: gateway
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
      name: http
